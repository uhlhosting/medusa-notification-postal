packages:
  - "."
# pnpm quarantines releases younger than `minimumReleaseAge` (default 1440
# minutes since v11) and needs each package's registry `time` metadata to do it.
# @medusajs/* packuments carry thousands of preview/snapshot versions, so npmjs
# throttles requests for them (medusajs/medusa#16294) and the check dies with
# ERR_PNPM_FETCH_429. Exempt only that scope — every other dependency keeps the
# 24h quarantine, and Medusa itself is pinned to exact, long-published versions.
minimumReleaseAgeExclude:
  - "@medusajs/*"
overrides:
  # Security floor: Medusa's dependencies still declare older lodash 4.17.x
  # ranges; 4.18.1 is the newest release.
  lodash: 4.18.1
allowBuilds:
  "@medusajs/telemetry": false
  # jest-haste-map 30.5 pulls this in. Its install script only compiles with
  # node-gyp when npm_config_build_from_source=true; prebuilt binaries are used.
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
# Refuse to install anything whose `engines` excludes the running Node.js. Some
# dev tooling sets a higher floor than the package's own `engines.node` (for
# example @semantic-release/git 11 wants ^22.22.2), so CI's NODE_VERSION has to
# satisfy the whole tree, not only this package.
engineStrict: true
