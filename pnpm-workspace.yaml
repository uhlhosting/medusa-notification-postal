packages:
  - "."
# pnpm quarantines releases younger than `minimumReleaseAge` (default 1440
# minutes since v11) and needs each package's registry `time` metadata to do it.
# @medusajs/* packuments carry thousands of preview/snapshot versions, so npmjs
# throttles requests for them (medusajs/medusa#16294) and the check dies with
# ERR_PNPM_FETCH_429. Exempt only that scope — every other dependency keeps the
# 24h quarantine, and Medusa itself is pinned to exact, long-published versions.
minimumReleaseAgeExclude:
  - "@medusajs/*"
overrides:
  zod: 4.6.7
  lodash: 4.18.1
  handlebars: 4.7.10
  proxy-addr: 2.0.8
  "axios@^1": 1.20.0
  "@grpc/grpc-js@^1": 1.14.6
  "figlet@^1": 1.11.3
  "http-cache-semantics@^4": 4.3.0
  "source-map-js@^1": 1.2.2
  "compression@^1": 1.8.2
  "ajv@^8": 8.18.0
  "protobufjs@^7": 7.6.5
  "qs@^6": 6.16.0
  "postcss-selector-parser@^7": 7.1.6
  "undici@^6": 6.29.1
  "undici@^7": 7.30.1
  "js-yaml@^3": 3.15.2
  "js-yaml@^4": 4.3.2
  # @tanstack/react-virtual 3.14.10 currently declares an unpublished
  # @tanstack/virtual-core 3.17.8 dependency. Keep the last resolvable pair.
  "@tanstack/react-virtual": 3.14.9
  # Rollup 4.62.5 was published without its platform-specific optional
  # packages, so native loading fails. Keep the complete 4.62.4 release.
  rollup: 4.62.4
  "follow-redirects@^1": 1.16.2
  "body-parser@^1": 1.20.9
  "multer@^2": 2.5.0
  "vite@^7": 7.3.7
  "@graphql-tools/utils@^12": 12.0.4
allowBuilds:
  "@medusajs/telemetry": false
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
