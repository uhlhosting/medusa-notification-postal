version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Medusa 2.16 admin extension build currently fails on esbuild 0.28.x.
      - dependency-name: "esbuild"

      # The admin extension is bundled into @medusajs/dashboard and shares its
      # React, React Query, Router and i18n instances at runtime. Medusa's admin
      # bundler does not dedupe them, so any other version installs, and gets
      # bundled, as a second copy that the dashboard never initialises. The
      # peerDependencies therefore pin the exact versions the dashboard depends
      # on, and the devDependencies mirror them so the admin typecheck runs
      # against the APIs the dashboard actually loads. @medusajs/dashboard
      # 2.19-2.21 depend on react ^18.3.1, react-router-dom 7.18.2,
      # react-i18next 13.5.0, i18next 23.7.11 and @tanstack/react-query 5.64.2.
      # scripts/verify-release.mjs fails when the pins drift from the installed
      # dashboard. Raise these only when Medusa itself does.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
      - dependency-name: "react-i18next"
      - dependency-name: "i18next"
      - dependency-name: "@tanstack/react-query"

      # @types/node must track the *minimum* supported runtime (engines: node
      # >=20), not the newest release, otherwise the build typechecks against
      # APIs that do not exist on the oldest Node this plugin supports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
