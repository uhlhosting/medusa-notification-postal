name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    env:
      COREPACK_ENABLE_STRICT: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.17.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          pnpm --version

      # Supply-chain verification stays ON for this job: it is the public npm
      # publish path and holds the OIDC trusted-publishing token, so it must not
      # trust the lockfile on faith. The npmjs rate limiting that used to break
      # it (medusajs/medusa#16294) is handled by the narrow
      # `minimumReleaseAgeExclude` for `@medusajs/*` in pnpm-workspace.yaml, so
      # every other dependency still gets the default 24h quarantine here.
      - name: Install
        run: |
          pnpm config set fetch-retries 5
          pnpm config set fetch-retry-maxtimeout 120000
          pnpm install --frozen-lockfile

      - name: Verify release provenance
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected_tag="v$(node -p "require('./package.json').version")"
            if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version tag ${expected_tag}." >&2
              exit 1
            fi

            git fetch --no-tags origin main
            tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
            if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
              echo "Tag ${GITHUB_REF_NAME} must point to a commit reachable from origin/main." >&2
              exit 1
            fi
          elif [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Manual npm publishing is only allowed from the protected main branch." >&2
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Release check
        run: pnpm release:check

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public --provenance
