include:
  - template: Jobs/SAST.latest.gitlab-ci.yml
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml

sast:
  before_script: []
  cache: []

semgrep-sast:
  allow_failure: false
  variables:
    # v6.19.1 crashes before producing SARIF on our runners.
    SAST_ANALYZER_IMAGE_TAG: "6.18.2"

secret_detection:
  before_script: []
  cache: []

# The security findings widget on merge requests is a GitLab Premium/Ultimate
# feature; this instance is Community Edition (Free). This job surfaces the SAST
# and Secret Detection results in the pipeline log and exposes the raw reports as
# a downloadable "Security scan reports" merge-request artifact (native,
# tokenless, Free-tier). Set SECURITY_FAIL_ON_FINDINGS=true to gate on findings.
security:report:
  stage: build
  needs:
    - job: semgrep-sast
      artifacts: true
      optional: true
    - job: secret_detection
      artifacts: true
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script: []
  cache: []
  script:
    - node scripts/security-summary.mjs
  artifacts:
    when: always
    expose_as: "Security scan reports"
    name: "security-reports-$CI_COMMIT_SHORT_SHA"
    paths:
      - gl-sast-report.json
      - gl-secret-detection-report.json
    expire_in: 30 days

security:secrets:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script: []
  cache: []
  needs:
    - job: secret_detection
      artifacts: true
  script:
    - node scripts/verify-secret-report.mjs

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - validate
  - test
  - build
  - release
  - deploy
  - mirror

variables:
  NODE_VERSION: "24.22.3"
  # Keep in sync with the `packageManager` field in package.json.
  PNPM_VERSION: "11.25.0"
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"
  # pnpm records the result of the supply-chain verification pass in its cache
  # dir (`lockfile-verified.jsonl`) alongside the registry metadata cache.
  # Keeping that cache in the project and keying it on pnpm-lock.yaml means only
  # the first job on a new lockfile pays for the sweep; the rest reuse it.
  PNPM_CACHE_DIR: "$CI_PROJECT_DIR/.pnpm-cache"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"
  GIT_STRATEGY: clone
  AST_ENABLE_MR_PIPELINES: "true"

default:
  tags:
    - uhlhosting-talos-k8s
  image: "node:${NODE_VERSION}-bookworm"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .pnpm-cache/
  before_script:
    - npm install -g "pnpm@${PNPM_VERSION}"
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm config set cache-dir "$PNPM_CACHE_DIR"
    # Survive transient npmjs throttling instead of failing the pipeline.
    - pnpm config set network-concurrency 8
    - pnpm config set fetch-retries 5
    - pnpm config set fetch-retry-maxtimeout 120000
    - pnpm install --frozen-lockfile --prefer-offline

validate:
  stage: validate
  script:
    - pnpm run lint
    - pnpm run typecheck
    - pnpm security:dependencies
    - node --test scripts/release-contract.test.mjs scripts/verify-secret-report.test.mjs

test:
  stage: test
  script:
    - pnpm run test:coverage
  coverage: '/[Aa]ll files[^|]*\|\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week

test:integration:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postal-postgres-localhost
  variables:
    POSTGRES_USER: medusa_test
    POSTGRES_DB: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    DB_HOST: postal-postgres-localhost
    DB_PORT: "5432"
    DB_USERNAME: medusa_test
    DB_PASSWORD: ""
    DATABASE_URL: postgres://medusa_test@postal-postgres-localhost:5432/postgres
  script:
    - pnpm test:integration:modules
    - pnpm test:integration:http
    - pnpm build
    - node scripts/verify-packed-consumer.mjs

build:
  stage: build
  script:
    - pnpm run build
    - node scripts/verify-packed-consumer.mjs
  artifacts:
    paths:
      - .medusa/
      - reports/
    expire_in: 1 hour

release:verify:
  stage: release
  script:
    - pnpm run release:check

# Semantic versioning and releases are fully automated with semantic-release
# (https://docs.gitlab.com/ci/examples/semantic-release/). It analyzes the
# Conventional Commits since the last tag, computes the next version, publishes
# the package to the GitLab npm registry, creates a GitLab Release with notes,
# and commits the bumped package.json + tag back to the default branch.
#
# Required project CI/CD variables (Settings > CI/CD > Variables):
#   - GITLAB_TOKEN: project/group access token, masked, scopes api +
#     write_repository, with permission to push to the protected default branch
#     and create protected `v*` tags. Used by @semantic-release/gitlab and
#     @semantic-release/git.
# The npm registry publish authenticates with the ephemeral CI_JOB_TOKEN.
release:semantic:
  stage: deploy
  needs:
    - validate
    - test
    - test:integration
    - semgrep-sast
    - security:secrets
    - security:report
    - build
    - release:verify
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    # semantic-release needs the full history and all tags to determine the
    # last release; disable shallow clone.
    GIT_DEPTH: "0"
    NPM_TOKEN: "${CI_JOB_TOKEN}"
    # The GitLab package registry does not support npm provenance; the GitHub
    # OIDC publish handles provenance for the public npmjs registry.
    NPM_CONFIG_PROVENANCE: "false"
  before_script:
    - npm install -g "pnpm@${PNPM_VERSION}"
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm config set cache-dir "$PNPM_CACHE_DIR"
    - pnpm config set network-concurrency 8
    - pnpm config set fetch-retries 5
    - pnpm config set fetch-retry-maxtimeout 120000
    - pnpm install --frozen-lockfile --prefer-offline
  script:
    # Fail fast with a clear message if the release credential is missing.
    # GITLAB_TOKEN must be a masked, protected project access token with
    # api + write_repository scopes (see AGENTS.md). semantic-release reads it
    # from the environment automatically.
    - |
      if [ -z "$GITLAB_TOKEN" ]; then
        echo "GITLAB_TOKEN is not set. Create a masked, protected project access token (scopes: api, write_repository) named GITLAB_TOKEN in Settings > CI/CD > Variables." >&2
        exit 1
      fi
    # Set the publish registry only after dependency installation. The npm
    # plugin uses NPM_TOKEN to create its temporary auth config for this URL.
    - NPM_CONFIG_REGISTRY="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" pnpm exec semantic-release

mirror:github:
  stage: deploy
  needs:
    - validate
    - test
    - test:integration
    - semgrep-sast
    - security:secrets
    - security:report
    - build
    - release:verify
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
  before_script: []
  cache: []
  script:
    - test -n "$GITHUB_MIRROR_SSH_PRIVATE_KEY" && test -n "$GITHUB_MIRROR_KNOWN_HOSTS"
    - |
      TASK_MIRROR_DIR=$(mktemp -d)
      trap 'rm -rf "$TASK_MIRROR_DIR"' EXIT
      chmod 700 "$TASK_MIRROR_DIR"
      printf '%s\n' "$GITHUB_MIRROR_SSH_PRIVATE_KEY" > "$TASK_MIRROR_DIR/key"
      printf '%s\n' "$GITHUB_MIRROR_KNOWN_HOSTS" > "$TASK_MIRROR_DIR/known_hosts"
      chmod 600 "$TASK_MIRROR_DIR/key" "$TASK_MIRROR_DIR/known_hosts"
      export GIT_SSH_COMMAND="ssh -i '$TASK_MIRROR_DIR/key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$TASK_MIRROR_DIR/known_hosts'"
      git fetch origin "$CI_DEFAULT_BRANCH" --tags
      test "$CI_COMMIT_SHA" = "$(git rev-parse "origin/$CI_DEFAULT_BRANCH")"
      set -- "refs/remotes/origin/$CI_DEFAULT_BRANCH:refs/heads/main"
      for TASK_RELEASE_TAG in $(git tag --merged "$CI_COMMIT_SHA" --list 'v[0-9]*'); do
        set -- "$@" "refs/tags/$TASK_RELEASE_TAG:refs/tags/$TASK_RELEASE_TAG"
      done
      git push --atomic git@github.com:uhlhosting/medusa-notification-postal.git "$@"
